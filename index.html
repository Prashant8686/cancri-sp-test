<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cancri-SP connection test</title>
</head>
<body>
  <h2>Connection test</h2>
  <pre id="result">Running...</pre>

  <script>
    (async () => {
      const hook =
        "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";

      const result = document.getElementById("result");

      const message = JSON.stringify({
        test: "GitHub Pages JavaScript executed",
        url: location.href,
        time: new Date().toISOString(),
        userAgent: navigator.userAgent
      });

      result.textContent = message;

      try {
        await fetch(hook, {
          method: "POST",
          mode: "no-cors",
          body: message
        });
      } catch (error) {
        result.textContent += "\nWebhook error: " + error;
      }
    })();
  </script>
</body>
</html>
